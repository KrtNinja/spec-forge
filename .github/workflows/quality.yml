name: quality

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Тесты (Node 22.5.1)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.5.1'
          cache: npm
          cache-dependency-path: tools/package-lock.json
      - run: npm --prefix tools ci --ignore-scripts --no-audit --no-fund
      - run: npm --prefix tools test

  quality:
    name: Качество JavaScript
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.5.1'
          cache: npm
          cache-dependency-path: tools/package-lock.json
      - run: npm --prefix tools ci --ignore-scripts --no-audit --no-fund
      - name: ESLint, типы, сложность и повторы
        run: npm --prefix tools run check
      - name: Тесты с покрытием
        run: npm --prefix tools run coverage
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: quality-reports
          path: |
            coverage/
            reports/
          if-no-files-found: warn
